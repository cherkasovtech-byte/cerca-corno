<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi cerca il corno</title>
<style>
  :root { --black: #000000; --white: #ffffff; --grey: #888888; --dark: #222222; --font: ui-monospace, monospace; }
  body { background: var(--black); color: var(--white); font-family: var(--font); margin: 0; padding: 16px 24px; }
  h1 { font-size: 16px; font-weight: normal; margin: 0 0 4px; text-align: center; }
  h2 { font-size: 13px; font-weight: normal; color: var(--grey); margin: 18px 0 0; }
  .strip { position: relative; }
  canvas { display: block; width: 100%; height: 400px; touch-action: pan-y; }
  .controls { position: absolute; display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .meter { height: 4px; background: var(--dark); border-radius: 2px; }
  .fill { height: 100%; width: 0%; border-radius: 2px; background: var(--white); }
  button { background: transparent; color: var(--white); border: 1px solid var(--white); font: inherit; font-size: 12px; padding: 4px 6px; white-space: nowrap; cursor: pointer; }
  button:hover { background: var(--white); color: var(--black); }
  .status { color: var(--grey); font-size: 11px; margin: 0; text-align: center; }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
  .seg { display: flex; }
  .seg button { flex: 1; padding: 4px 0; }
  .seg button + button { border-left: none; }
  .seg button.on, button.on { background: var(--white); color: var(--black); }
</style>
</head>
<body>
<h1>Chi cerca il corno</h1>

<div class="strip"><canvas id="layoutB"></canvas><div class="controls" id="controlsB"></div></div>


<script>
const noteLetters = ["Do", "Do", "Re", "Mi", "Mi", "Fa", "Fa", "Sol", "La", "La", "Si", "Si"];
const noteAccidentals = ["", "♯", "", "♭", "", "", "♯", "", "♭", "", "♭", ""];
const letterSteps = [0, 0, 1, 2, 2, 3, 3, 4, 5, 5, 6, 6];
let referenceA = 442;
let transposition = 7;
try {
  referenceA = Number(localStorage.getItem("referenceA")) || 442;
  const saved = localStorage.getItem("transposition");
  if (saved !== null) transposition = Number(saved);
} catch (error) {}
// строй оркестра (440 или 442) и строй инструмента (C = 0, B♭ = +2, F = +7 полутонов к написанной ноте);
// выбор запоминается в браузере
const inTuneCents = 10;
const minLoudness = 0.004;
const minClarity = 0.7;
const smoothingFrames = 7;
const startFrames = 12;
const changeFrames = 6;
const gapFrames = 8;
const holdCents = 70;
const centsEveryFrames = 8;
// тише 0.01 — тишина; «чистота» ниже 0.8 — шум, а не нота; сглаживание — скользящая медиана 7 кадров;
// новая нота начинается, если звук держится 12 кадров (0.2 с); на другую ноту переходим, только если новая высота держится 6 кадров (0.1 с);
// провал звука до 8 кадров (0.13 с) нота переживает (в линии просто разрыв); пока высота в пределах ±70 центов от ноты, нота та же

function writtenMidiToNote(writtenMidi) {
  const midi = Math.round(writtenMidi);
  const octave = Math.floor(midi / 12) - 1;
  return {
    letter: noteLetters[midi % 12],
    accidental: noteAccidentals[midi % 12],
    octave: octave,
    cents: Math.round(100 * (writtenMidi - midi)),
    staffStep: octave * 7 + letterSteps[midi % 12]
  };
}
// написанная высота (дробный номер MIDI) -> нота, центы и ступень на нотоносце

function frequencyToWrittenMidi(frequency) {
  return 69 + 12 * Math.log2(frequency / referenceA) + transposition;
}

function writtenMidiToFrequency(writtenMidi) {
  return referenceA * Math.pow(2, (writtenMidi - transposition - 69) / 12);
}
// обратно: написанная нота валторны -> реальная частота (нужно тестовой мелодии)


const yinThreshold = 0.15;
let yinBuffer = null;

function detectFrequencyYin(samples, sampleRate) {
  const size = samples.length / 2;
  const minLag = Math.floor(sampleRate / 2000);
  const maxLag = Math.min(Math.floor(sampleRate / 60), size - 1);
  if (yinBuffer === null || yinBuffer.length !== maxLag + 2) yinBuffer = new Float32Array(maxLag + 2);
  const d = yinBuffer;
  d[0] = 1;
  let runningSum = 0;
  for (let lag = 1; lag <= maxLag + 1; lag++) {
    let sum = 0;
    for (let i = 0; i < size; i++) {
      const delta = samples[i] - samples[i + lag];
      sum += delta * delta;
    }
    runningSum += sum;
    d[lag] = runningSum > 0 ? sum * lag / runningSum : 1;
  }
  // шаги 2 и 3 YIN: разность волны с собой при каждом сдвиге, нормированная на среднее по меньшим сдвигам

  let best = -1;
  for (let lag = minLag; lag <= maxLag; lag++) {
    if (d[lag] < yinThreshold) {
      while (lag + 1 <= maxLag && d[lag + 1] < d[lag]) lag++;
      best = lag;
      break;
    }
  }
  if (best === -1) {
    best = minLag;
    for (let lag = minLag; lag <= maxLag; lag++) if (d[lag] < d[best]) best = lag;
  }
  // шаг 4: первый сдвиг, где разность упала ниже порога 0.15, и дно этой ямы; если такого нет — самая глубокая яма

  const a = d[best - 1], b = d[best], c = d[best + 1];
  const bend = a - 2 * b + c;
  const shift = bend > 0 ? 0.5 * (a - c) / bend : 0;
  return { frequency: sampleRate / (best + shift), clarity: 1 - b };
}
// шаг 5: парабола через три точки ямы уточняет сдвиг между отсчётами (поэтому нет ступенек по 5–9 центов);
// чистота = 1 − глубина ямы, по смыслу как у автокорреляции

function median(values) {
  const sorted = values.slice().sort((a, b) => a - b);
  return sorted[Math.floor(sorted.length / 2)];
}

function centsColor(cents) {
  if (Math.abs(cents) <= inTuneCents) {
    return "hsl(140, 60%, 65%)";
  }
  const distance = Math.min(1, (Math.abs(cents) - inTuneCents) / (50 - inTuneCents));
  if (cents < 0) {
    return "hsl(" + (195 + 35 * distance) + ", 90%, " + (75 - 15 * distance) + "%)";
  }
  return "hsl(" + (335 + 25 * distance) + ", 90%, " + (78 - 20 * distance) + "%)";
}

const warnCents = inTuneCents + 15;

function signColor(accidental) {
  if (accidental === "♭") return "hsl(205, 90%, 68%)";
  if (accidental === "♯") return "hsl(340, 90%, 72%)";
  return "#ffffff";
}

function noteBackground(accidental) {
  if (accidental === "♭") return "hsl(208, 55%, 24%)";
  if (accidental === "♯") return "hsl(338, 45%, 26%)";
  return "hsl(0, 0%, 19%)";
}
// фон ноты: бемоль голубоватый, диез розоватый, остальные серые (чуть светлее, чем было)

const schemes = {
  orange: { warnLow: "hsl(32, 95%, 60%)", warnHigh: "hsl(32, 95%, 60%)", badLow: "hsl(0, 85%, 58%)", badHigh: "hsl(0, 85%, 58%)" }
};
// цвет для второго окна (10–25 центов) и для всего, что дальше 25

function zoneColor(cents, scheme) {
  const s = schemes[scheme];
  const size = Math.abs(cents);
  if (size <= inTuneCents) return "#ffffff";
  if (size <= warnCents) return cents < 0 ? s.warnLow : s.warnHigh;
  return cents < 0 ? s.badLow : s.badHigh;
}
// цвет линии на ленте: белая, пока в допуске

function levelColor(cents, scheme) {
  return Math.abs(cents) <= inTuneCents ? "hsl(140, 60%, 65%)" : zoneColor(cents, scheme);
}
// цвет метки в лупе: как на ленте, только в допуске зелёная

function transparent(color, alpha) {
  return color.replace("hsl(", "hsla(").replace(")", ", " + alpha + ")");
}
// тот же цвет, только полупрозрачный: для фона зон в лупе

const scalePoints = [[0, 0], [inTuneCents, 1 / 3], [warnCents, 2 / 3], [50, 1]];

function centsToUnit(cents) {
  const size = Math.min(50, Math.abs(cents));
  for (let i = 1; i < scalePoints.length; i++) {
    const [c0, u0] = scalePoints[i - 1];
    const [c1, u1] = scalePoints[i];
    if (size <= c1) {
      const unit = u0 + (u1 - u0) * (size - c0) / (c1 - c0);
      return cents < 0 ? -unit : unit;
    }
  }
  return cents < 0 ? -1 : 1;
}
// нелинейная шкала: центы -> доля половины высоты (от −1 до 1). Пять зон: красная, рыжая, зелёная, рыжая, красная;
// рыжая и красная одной высоты, зелёная вдвое выше; внутри каждой зоны равномерно

const zoneBorders = [-warnCents, -inTuneCents, inTuneCents, warnCents];

function splitAtZones(points) {
  const result = [];
  points.forEach((point, i) => {
    if (i > 0) {
      const before = points[i - 1];
      zoneBorders
        .filter((border) => (before.cents - border) * (point.cents - border) < 0)
        .map((border) => ({ t: (border - before.cents) / (point.cents - before.cents), cents: border }))
        .sort((a, b) => a.t - b.t)
        .forEach((crossing) => result.push({ x: before.x + (point.x - before.x) * crossing.t, cents: crossing.cents }));
    }
    result.push(point);
  });
  return result;
}
// если между двумя соседними точками линия перескакивает границу зоны, вставляем точку ровно на границе,
// чтобы каждый кусок линии красился по своей зоне

function createTrack(detect) {
  return { detect: detect, history: [], raw: [], frames: [], current: null, lastCents: 0, pendingMidi: [], candidate: [], gap: 0,
           shownCents: null, shownHertz: null, shownNote: null, smoothed: null, clarity: null };
}
const tracks = { B: createTrack(detectFrequencyYin) };
let track = tracks.B;
// у каждого варианта своя лента и своё состояние; track — тот, с которым сейчас работают функции ниже

function setStatus(text) {
  document.querySelectorAll(".status:not(.debug)").forEach((element) => { element.textContent = text; });
}

function currentNote() {
  if (track.current === null) return null;
  const note = writtenMidiToNote(track.current);
  note.cents = track.lastCents;
  return note;
}
// нота, которая звучит прямо сейчас (или null), с последним отклонением

let canvasHeight = 400;
const gap = 29;
const half = gap / 2;
let bottomY = 212;
let middleY = bottomY - 2 * gap;
const bottomLineStep = 4 * 7 + 2;
const stepX = 1;
const pauseSteps = Math.round(2.5 * gap / stepX);
const signRoomSteps = Math.round(15 / stepX);
const zoomHalf = 2 * gap;
const stepToY = (staffStep) => bottomY - (staffStep - bottomLineStep) * half;
// всё по вертикали на 15% меньше прежнего; шкала справа ровно от верхней до нижней линейки
// лента пишет каждый кадр, ровно 1 px на кадр (60 px в секунду): при целом шаге линии не дрожат при прокрутке; пауза растёт до 2.5 расстояния между линейками;
// если перед нотой тишина хотя бы 15 px, знак встаёт в неё, иначе внутрь начала ноты

// лента track.history: { type: "note" | "pending", note, cents } или { type: "silent" }; cents = null — разрыв линии внутри ноты

const centsFrom = (midi, base) => Math.round(100 * (midi - base));

let stopOnSilence = true;
try { stopOnSilence = localStorage.getItem("stopOnSilence") !== "off"; } catch (error) {}
// останавливать ли ленты в тишине (тумблер под шкалой); выбор запоминается

function trimPause() {
  if (!stopOnSilence) return;
  const history = track.history;
  let silent = 0;
  for (let i = history.length - 1; i >= 0 && history[i].type === "silent"; i--) silent++;
  while (silent > pauseSteps) { history.pop(); silent--; }
}
// хвост тишины не длиннее паузы: дальше лента стоит (если тумблер включён)

function pushSilent() {
  if (track.history.length > 0) track.history.push({ type: "silent" });
  trimPause();
}

function retag(count, base, values) {
  const history = track.history;
  for (let k = 0; k < count; k++) {
    const midi = values[values.length - 1 - k];
    const close = Math.abs(midi - base) * 100 <= holdCents;
    history[history.length - 1 - k] = { type: "note", note: writtenMidiToNote(base), cents: close ? centsFrom(midi, base) : null };
  }
}
// задним числом переписать последние кадры как ноту base (кадры далеко от неё — разрыв линии)

function addFrame(midi) {
  const history = track.history;
  if (track.current === null) {
    if (midi === null) {
      for (let k = 0; k < track.pendingMidi.length; k++) history[history.length - 1 - k] = { type: "silent" };
      track.pendingMidi = [];
      pushSilent();
      return;
    }
    track.pendingMidi.push(midi);
    history.push({ type: "pending", note: writtenMidiToNote(Math.round(midi)), cents: centsFrom(midi, Math.round(midi)) });
    if (track.pendingMidi.length >= startFrames) {
      const base = Math.round(median(track.pendingMidi));
      retag(track.pendingMidi.length, base, track.pendingMidi);
      track.current = base;
      track.lastCents = centsFrom(midi, base);
      track.pendingMidi = [];
      track.candidate = [];
      track.gap = 0;
    }
    return;
  }
  // звука ещё нет: копим кадры бледно; держится 12 кадров — это нота (по медиане), иначе тишина

  if (midi === null) {
    track.gap++;
    if (track.gap > gapFrames) {
      for (let k = 0; k < gapFrames; k++) history[history.length - 1 - k] = { type: "silent" };
      track.current = null;
      track.candidate = [];
      track.gap = 0;
      pushSilent();
    } else {
      history.push({ type: "note", note: writtenMidiToNote(track.current), cents: null });
    }
    return;
  }
  track.gap = 0;
  // провал звука: до 8 кадров нота продолжается с разрывом линии, дольше — нота кончилась

  if (Math.abs(midi - track.current) * 100 <= holdCents) {
    track.candidate = [];
    track.lastCents = centsFrom(midi, track.current);
    history.push({ type: "note", note: writtenMidiToNote(track.current), cents: track.lastCents });
    return;
  }
  // высота рядом с нотой (±70 центов): та же нота, рисуем отклонение

  if (track.candidate.length > 0 && Math.abs(midi - median(track.candidate)) > 0.7) track.candidate = [];
  track.candidate.push(midi);
  history.push({ type: "note", note: writtenMidiToNote(track.current), cents: null });
  if (track.candidate.length >= changeFrames) {
    const base = Math.round(median(track.candidate));
    retag(track.candidate.length, base, track.candidate);
    track.current = base;
    track.lastCents = centsFrom(midi, base);
    track.candidate = [];
  }
}
// высота ушла далеко: пока это не продержалось 6 кадров, считаем помехой (разрыв линии в текущей ноте);
// продержалось — переходим на новую ноту, и эти 6 кадров задним числом становятся её началом

function findRuns(headX) {
  const history = track.history;
  const firstIndex = Math.max(0, history.length - Math.ceil(headX / stepX) - 1);
  const runs = [];
  let current = null;
  let silentBefore = 0;
  for (let i = firstIndex; i < history.length; i++) {
    const right = headX - (history.length - 1 - i) * stepX;
    const item = history[i];
    if (item.type === "silent") { current = null; silentBefore++; continue; }
    const note = item.note;
    const same = current && note.staffStep === current.staffStep && note.accidental === current.accidental && (item.type === "pending") === current.pending;
    if (same) {
      current.right = right;
      current.points.push({ x: right - stepX / 2, cents: item.cents });
    } else {
      current = {
        left: right - stepX, right: right,
        staffStep: note.staffStep, accidental: note.accidental,
        pending: item.type === "pending",
        afterSilence: i === firstIndex || history[i - 1].type === "silent",
        signRoom: i === firstIndex || silentBefore >= signRoomSteps,
        points: [{ x: right - stepX / 2, cents: item.cents }]
      };
      runs.push(current);
    }
    silentBefore = 0;
  }
  return runs;
}
// каждое показание и каждый тихий шаг занимают stepX; самое новое у головки, старое левее

function drawAccidental(ctx, accidental, rightX, centerY, size, color) {
  const width = size * 0.42;
  ctx.strokeStyle = color;
  ctx.lineCap = "butt";
  if (accidental === "♯") {
    const tilt = size * 0.07;
    ctx.lineWidth = size * 0.06;
    ctx.beginPath();
    ctx.moveTo(rightX - width * 0.72, centerY - size * 0.46); ctx.lineTo(rightX - width * 0.72, centerY + size * 0.5);
    ctx.moveTo(rightX - width * 0.28, centerY - size * 0.5); ctx.lineTo(rightX - width * 0.28, centerY + size * 0.46);
    ctx.stroke();
    ctx.lineWidth = size * 0.13;
    ctx.beginPath();
    ctx.moveTo(rightX - width, centerY - size * 0.15 + tilt); ctx.lineTo(rightX, centerY - size * 0.15 - tilt);
    ctx.moveTo(rightX - width, centerY + size * 0.15 + tilt); ctx.lineTo(rightX, centerY + size * 0.15 - tilt);
    ctx.stroke();
  } else {
    const stemX = rightX - width * 0.85;
    ctx.lineWidth = size * 0.07;
    ctx.beginPath();
    ctx.moveTo(stemX, centerY - size * 0.75); ctx.lineTo(stemX, centerY + size * 0.3);
    ctx.stroke();
    ctx.lineWidth = size * 0.09;
    ctx.beginPath();
    ctx.moveTo(stemX, centerY - size * 0.08);
    ctx.bezierCurveTo(stemX + width * 0.75, centerY - size * 0.36, stemX + width * 1.25, centerY + size * 0.02, stemX, centerY + size * 0.3);
    ctx.stroke();
  }
  ctx.lineCap = "round";
}

function drawRuns(ctx, runs, headX, scheme) {
  const signSize = gap * 0.8;
  const signSpace = Math.round(signSize * 0.42) + 6;
  for (const run of runs) {
    ctx.globalAlpha = run.pending ? 0.35 : 1;
    const left = run.left + (run.afterSilence ? 0 : 1);
    const right = run.right - 1;
    const signInside = run.accidental !== "" && !run.signRoom;
    const bodyLeft = signInside ? Math.min(left + signSpace, right - 2) : left;
    const centerY = stepToY(run.staffStep);
    const top = centerY - half;
    const bodyWidth = Math.max(right - bodyLeft, 2);
    const clampY = (cents) => Math.max(top + 2, Math.min(top + gap - 2, centerY - centsToUnit(cents) * half));

    ctx.strokeStyle = "#555555";
    ctx.lineWidth = 2;
    const overhang = gap * 0.45;
    for (let s = bottomLineStep - 2; s >= run.staffStep; s -= 2) {
      ctx.beginPath(); ctx.moveTo(left - overhang, stepToY(s)); ctx.lineTo(Math.min(right + overhang, headX), stepToY(s)); ctx.stroke();
    }
    for (let s = bottomLineStep + 10; s <= run.staffStep; s += 2) {
      ctx.beginPath(); ctx.moveTo(left - overhang, stepToY(s)); ctx.lineTo(Math.min(right + overhang, headX), stepToY(s)); ctx.stroke();
    }
    // добавочные линейки с выносом, но не дальше головки

    ctx.fillStyle = noteBackground(run.accidental);
    ctx.beginPath();
    ctx.roundRect(bodyLeft, top, bodyWidth, gap, Math.min(6, bodyWidth / 2));
    ctx.fill();
    if (bodyWidth > 10) {
      ctx.strokeStyle = "rgba(255, 255, 255, 0.18)";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.moveTo(bodyLeft + 4, centerY); ctx.lineTo(right - 4, centerY); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (bodyWidth > 6) {
      ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      for (const border of zoneBorders) {
        const y = centerY - centsToUnit(border) * half;
        ctx.moveTo(bodyLeft + 2, y); ctx.lineTo(right - 2, y);
      }
      ctx.stroke();
    }
    // тело ноты цветом знака, пунктир нуля и еле заметные линии границ зон (±10, ±25), как на шкале

    ctx.lineWidth = 3;
    const pieces = [[]];
    for (const point of run.points) {
      if (point.x < bodyLeft + 1) continue;
      if (point.cents === null) { if (pieces[pieces.length - 1].length > 0) pieces.push([]); }
      else pieces[pieces.length - 1].push(point);
    }
    // куски линии между разрывами (провалы и помехи внутри ноты)

    for (const piece of pieces) {
    let previous = null;
    let color = null;
    const visible = splitAtZones(piece);
    for (const point of visible) {
      const pointColor = previous === null ? zoneColor(point.cents, scheme) : zoneColor((previous.cents + point.cents) / 2, scheme);
      if (previous === null) {
        ctx.beginPath();
        ctx.moveTo(Math.max(point.x - stepX / 2, bodyLeft + 1), clampY(point.cents));
        color = pointColor;
      } else if (pointColor !== color) {
        ctx.strokeStyle = color;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(previous.x, clampY(previous.cents));
        color = pointColor;
      }
      ctx.lineTo(point.x, clampY(point.cents));
      previous = point;
    }
    if (previous !== null) {
      ctx.strokeStyle = color;
      ctx.stroke();
    }
    }
    // линия идёт кусками одного цвета; цвет куска — по середине между его концами, поэтому через зелёную зону линия всегда белая

    if (run.accidental !== "") {
      drawAccidental(ctx, run.accidental, bodyLeft - 3, centerY, signSize, signColor(run.accidental));
    }
    // знак всегда: в тишину перед нотой, а если тишины нет, то в начало самой ноты
  }
}

function drawNameAccidental(ctx, accidental, rightX, capTop, baseline, stem, color, extra) {
  const cap = baseline - capTop;
  ctx.strokeStyle = color;
  if (accidental === "♯") {
    const height = cap * 1.0;
    const width = cap * 0.5;
    const middle = (capTop + baseline) / 2;
    const left = rightX - width;
    const tilt = height * 0.06;
    ctx.lineCap = "butt";
    ctx.lineWidth = stem * 0.6 + extra;
    ctx.beginPath();
    ctx.moveTo(left + width * 0.33, middle - height / 2 + tilt); ctx.lineTo(left + width * 0.33, middle + height / 2);
    ctx.moveTo(left + width * 0.67, middle - height / 2); ctx.lineTo(left + width * 0.67, middle + height / 2 - tilt);
    ctx.stroke();
    ctx.lineWidth = stem * 1.05 + extra;
    ctx.beginPath();
    ctx.moveTo(left, middle - height * 0.17 + tilt); ctx.lineTo(rightX, middle - height * 0.17 - tilt);
    ctx.moveTo(left, middle + height * 0.17 + tilt); ctx.lineTo(rightX, middle + height * 0.17 - tilt);
    ctx.stroke();
  } else {
    const stemX = rightX - cap * 0.4;
    ctx.lineCap = "butt";
    ctx.lineWidth = stem * 0.75 + extra;
    ctx.beginPath();
    ctx.moveTo(stemX, capTop - cap * 0.05); ctx.lineTo(stemX, baseline + stem / 2);
    ctx.stroke();
    ctx.lineCap = "round";
    ctx.lineWidth = stem * 0.85 + extra;
    ctx.beginPath();
    ctx.moveTo(stemX, baseline - cap * 0.4);
    ctx.bezierCurveTo(stemX + cap * 0.5, baseline - cap * 0.64, stemX + cap * 0.55, baseline - cap * 0.18, stemX, baseline);
    ctx.stroke();
  }
  ctx.lineCap = "round";
}
// знак у имени ноты: чуть тоньше букв и ростом с заглавную букву; диез по середине букв,
// у бемоля палочка до верха букв, а низ кружка стоит на нижней линии букв

function displayOctave(note) {
  return note.octave - 3;
}
// октава по-нашему: Соль на второй линейке — Соль 1, над нотоносцем — Соль 2 (первая октава = 1)

function drawNoteName(ctx, centerX, centerY, size, outline) {
  const note = currentNote();
  if (note === null) return;
  ctx.font = size + "px ui-monospace, monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  const box = ctx.measureText(note.letter);
  const inkWidth = box.actualBoundingBoxLeft + box.actualBoundingBoxRight;
  const capHeight = box.actualBoundingBoxAscent;
  const inkLeft = centerX - inkWidth / 2;
  const xHeight = ctx.measureText("x").actualBoundingBoxAscent;
  const baseline = centerY + xHeight / 2;
  const x = inkLeft + box.actualBoundingBoxLeft;
  const stem = size * 0.085;
  const outlineWidth = size * 0.06;
  const widest = ctx.measureText("Sol");
  const widestHalf = (widest.actualBoundingBoxLeft + widest.actualBoundingBoxRight) / 2;
  const signCenterX = centerX - widestHalf - size * 0.3;
  const octaveCenterX = centerX + widestHalf + size * 0.36;
  // места знака и октавы постоянные: сразу за краями самого длинного названия (Sol), поэтому не пляшут
  // меряем сами буквы (а не клетку шрифта): по ширине середина в centerX, по высоте в centerY — середина строчных букв
  // (слово читается по строчным), заглавные выступают вверх; stem — толщина штриха букв

  if (note.accidental !== "") {
    const signRight = signCenterX + capHeight * 0.25;
    drawNameAccidental(ctx, note.accidental, signRight, baseline - capHeight, baseline, stem, outline, outlineWidth);
    drawNameAccidental(ctx, note.accidental, signRight, baseline - capHeight, baseline, stem, "#ffffff", 0);
  }
  // знак на своём постоянном месте слева, не зависит от длины названия

  ctx.lineJoin = "round";
  ctx.lineWidth = outlineWidth;
  ctx.strokeStyle = outline;
  ctx.strokeText(note.letter, x, baseline);
  ctx.fillStyle = "#ffffff";
  ctx.fillText(note.letter, x, baseline);
  // буквы с тонкой тёмной обводкой, чтобы читались поверх метки

  const octaveText = String(displayOctave(note));
  ctx.font = Math.round(size * 0.5) + "px ui-monospace, monospace";
  const octaveBox = ctx.measureText(octaveText);
  const octaveInk = octaveBox.actualBoundingBoxLeft + octaveBox.actualBoundingBoxRight;
  const octaveX = octaveCenterX - octaveInk / 2 + octaveBox.actualBoundingBoxLeft;
  const octaveBaseline = centerY + octaveBox.actualBoundingBoxAscent / 2;
  ctx.lineWidth = outlineWidth;
  ctx.strokeText(octaveText, octaveX, octaveBaseline);
  ctx.fillStyle = "#ffffff";
  ctx.fillText(octaveText, octaveX, octaveBaseline);
  // номер октавы на своём постоянном месте справа, по середине высоты букв
}
// в тишине имени нет

function drawCentsNumber(ctx, centerX, centerY, size, scheme) {
  if (track.shownCents === null) return;
  ctx.textBaseline = "middle";
  ctx.font = size + "px ui-monospace, monospace";
  const number = String(Math.abs(track.shownCents));
  const halfNumber = ctx.measureText(number).width / 2;
  ctx.fillStyle = levelColor(track.shownCents, scheme);
  ctx.textAlign = "center";
  ctx.fillText(number, centerX, centerY);
  ctx.textAlign = "right";
  ctx.fillText(track.shownCents < 0 ? "−" : (track.shownCents > 0 ? "+" : ""), centerX - halfNumber, centerY);
}
// число центов цветом зоны (как метка в лупе); знак висит слева и не сдвигает число

function drawHertz(ctx, centerX, centerY, size) {
  if (track.shownHertz === null) return;
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";
  ctx.font = size + "px ui-monospace, monospace";
  ctx.fillStyle = "#888888";
  ctx.fillText(track.shownHertz.toFixed(1) + " Hz", centerX, centerY);
}

function drawMagnifier(ctx, source, zoomX, zoneRight, scheme, textInside) {
  const current = currentNote();
  const top = middleY - zoomHalf;
  const height = 2 * zoomHalf;
  const width = zoneRight - zoomX;
  const labelWidth = 30;
  const centsToY = (c) => middleY - centsToUnit(c) * zoomHalf;

  if (current && source) {
    ctx.fillStyle = "rgba(255, 255, 255, 0.06)";
    ctx.beginPath();
    ctx.moveTo(source.x, source.top); ctx.lineTo(zoomX, top); ctx.lineTo(zoomX, top + height); ctx.lineTo(source.x, source.bottom);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(source.x, source.top); ctx.lineTo(zoomX, top);
    ctx.moveTo(source.x, source.bottom); ctx.lineTo(zoomX, top + height);
    ctx.stroke();
    ctx.strokeStyle = levelColor(current.cents, scheme);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(source.x, source.y); ctx.lineTo(zoomX, centsToY(current.cents)); ctx.stroke();
    ctx.fillStyle = zoneColor(current.cents, scheme);
    ctx.beginPath(); ctx.arc(source.x, source.y, 4, 0, 2 * Math.PI); ctx.fill();
  }
  // воронка от полосы текущей ноты на правом краю графика к лупе и тяга от точки высоты к метке

  ctx.save();
  ctx.beginPath(); ctx.roundRect(zoomX, top, width, height, 6); ctx.clip();
  ctx.fillStyle = "hsl(0, 0%, 13%)";
  ctx.fillRect(zoomX, top, width, height);
  const s = schemes[scheme];
  const band = (from, to, color) => { ctx.fillStyle = color; ctx.fillRect(zoomX, centsToY(to), width, centsToY(from) - centsToY(to)); };
  band(warnCents, 50, transparent(s.badHigh, 0.16));
  band(inTuneCents, warnCents, transparent(s.warnHigh, 0.14));
  band(-inTuneCents, inTuneCents, "hsla(140, 60%, 65%, 0.16)");
  band(-warnCents, -inTuneCents, transparent(s.warnLow, 0.14));
  band(-50, -warnCents, transparent(s.badLow, 0.16));
  ctx.restore();
  // фон лупы по зонам: зелёный допуск ±10, второе окно до ±25, дальше третья зона

  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  ctx.font = "11px ui-monospace, monospace";
  for (const c of [-warnCents, -inTuneCents, 0, inTuneCents, warnCents]) {
    const y = centsToY(c);
    ctx.strokeStyle = c === 0 ? "rgba(255, 255, 255, 0.35)" : "rgba(255, 255, 255, 0.15)";
    ctx.lineWidth = 1;
    ctx.setLineDash(c === 0 ? [4, 6] : []);
    ctx.beginPath(); ctx.moveTo(zoomX + 4, y); ctx.lineTo(zoneRight - labelWidth, y); ctx.stroke();
    ctx.setLineDash([]);
    if (c !== 0) {
      ctx.fillStyle = "#777777";
      ctx.fillText((c > 0 ? "+" : "−") + Math.abs(c), zoneRight - 4, y);
    }
  }
  // подписи только на границах зон; ноль и так виден по пунктиру

  if (current) {
    ctx.strokeStyle = levelColor(current.cents, scheme);
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(zoomX, centsToY(current.cents)); ctx.lineTo(zoneRight - labelWidth, centsToY(current.cents)); ctx.stroke();
  }
  // движется только метка

  if (textInside) {
    const centerX = zoomX + width / 2;
    drawNoteName(ctx, centerX, middleY, 54, "hsl(0, 0%, 12%)");
    drawCentsNumber(ctx, centerX, top + height - 14, 18, scheme);
    drawHertz(ctx, centerX, top - 16, 16);
  }
  // вариант 2: имя ноты поверх метки, по центру всей шкалы; центы внизу шкалы; герцы над шкалой
}

const layouts = [
  { canvas: "layoutB", controls: "controlsB", scale: "wide", text: "inside", track: "B" }
];
// одна полоса на YIN

let graphShare = 0.28;
try { graphShare = Number(localStorage.getItem("graphShare")) || 0.28; } catch (error) {}
let dividerX = 0;
// доля ширины под график частоты; dividerX — где сейчас его левая граница (её можно таскать)

const blackKeys = [1, 3, 6, 8, 10];

const graphLow = 50;
const graphHigh = 91;
// диапазон графика (написанные ноты): от Re малой октавы (4 добавочные под нотоносцем) до Sol третьей (4 добавочные над ним)

function drawGraph(ctx, left, right, top, bottom) {
  const width = right - left;
  const height = bottom - top;
  const key = height / (graphHigh - graphLow + 1);
  const yOf = (midi) => bottom - (midi - graphLow + 0.5) * key;
  // по вертикали всё неподвижно: весь диапазон вписан в высоту графика, key — высота одного полутона

  ctx.save();
  ctx.beginPath(); ctx.roundRect(left, top, width, height, 6); ctx.clip();
  for (let midi = graphLow; midi <= graphHigh; midi++) {
    const black = blackKeys.includes(midi % 12);
    ctx.fillStyle = black ? "hsl(0, 0%, 7%)" : "hsl(0, 0%, 17%)";
    ctx.fillRect(left, yOf(midi + 0.5), width, key);
    const edge = Math.round(yOf(midi + 0.5)) + 0.5;
    ctx.strokeStyle = midi % 12 === 11 ? "hsl(0, 0%, 45%)" : "hsl(0, 0%, 28%)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(left, edge); ctx.lineTo(right, edge); ctx.stroke();
    if (midi % 12 === 0) {
      ctx.fillStyle = "#8a8a8a";
      ctx.font = "10px ui-monospace, monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText("Do " + displayOctave(writtenMidiToNote(midi)), left + 5, yOf(midi));
    }
  }
  // фон как клавиатура: белые клавиши светлее, чёрные темнее, линии между полутонами;
  // граница между си и до ярче, у до подписан номер октавы

  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  let previous = null;
  for (let k = 0; k < track.raw.length; k++) {
    const x = right - (track.raw.length - 1 - k) - 0.5;
    const midi = track.raw[k];
    if (x < left || midi === null || midi < graphLow - 0.5 || midi > graphHigh + 0.5) { previous = null; continue; }
    if (previous === null || Math.abs(midi - previous) > 0.3) ctx.moveTo(x - 0.5, yOf(midi));
    ctx.lineTo(x + 0.5, yOf(midi));
    previous = midi;
  }
  ctx.stroke();
  ctx.restore();
  // сырая высота каждого кадра, 1 px на кадр, новое у правого края; соседние кадры соединяем, только если
  // высота сдвинулась меньше чем на 0.3 полутона: скачки между нотами (и легато тоже) — без вертикальных палок
}

function drawLayout(layout, scheme) {
  track = tracks[layout.track];
  const canvas = document.getElementById(layout.canvas);
  const controls = document.getElementById(layout.controls);
  const reach = 14 + controls.offsetHeight;
  canvasHeight = Math.round(4 * gap + 2 * reach + 16);
  middleY = canvasHeight / 2;
  bottomY = middleY + 2 * gap;
  if (canvas.style.height !== canvasHeight + "px") canvas.style.height = canvasHeight + "px";
  // высота полосы: шкала (от верхней до нижней линейки) плюс столько же сверху, сколько кнопки занимают снизу

  const ratio = window.devicePixelRatio || 1;
  const width = canvas.clientWidth;
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(canvasHeight * ratio);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, width, canvasHeight);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  // чёткость на ретине: рисуем в реальных пикселях экрана

  const scaleWidth = Math.max(200, Math.min(260, width * 0.22));
  const zoomX = Math.round(width - scaleWidth);
  const headX = Math.round(zoomX - Math.max(40, width * 0.06));
  const graphRight = Math.max(80, Math.min(headX - 150, Math.round(width * graphShare)));
  dividerX = graphRight;
  const staffLeft = graphRight + 12;
  // слева направо: график частоты, лента нотоносца, воронка, шкала

  const graphTop = middleY - 2 * gap - reach;
  const graphBottom = middleY + 2 * gap + reach;
  drawGraph(ctx, 0, graphRight, graphTop, graphBottom);
  ctx.fillStyle = "#777777";
  ctx.beginPath(); ctx.roundRect(graphRight + 3, middleY - 16, 4, 32, 2); ctx.fill();
  // график и ручка на его правой границе

  ctx.save();
  ctx.beginPath(); ctx.rect(staffLeft, 0, width - staffLeft, canvasHeight); ctx.clip();
  ctx.strokeStyle = "#555555";
  ctx.lineWidth = 2;
  for (let line = 0; line < 5; line++) {
    const y = bottomY - line * gap;
    ctx.beginPath(); ctx.moveTo(staffLeft, y); ctx.lineTo(headX, y); ctx.stroke();
  }
  ctx.strokeStyle = "#333333";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(headX + 0.5, bottomY - 4 * gap); ctx.lineTo(headX + 0.5, bottomY); ctx.stroke();
  drawRuns(ctx, findRuns(headX), headX, scheme);
  ctx.globalAlpha = 1;
  ctx.restore();
  // лента нотоносца между графиком и головкой; всё, что левее, обрезаем

  const current = currentNote();
  let source = null;
  if (current) {
    const centerY = stepToY(current.staffStep);
    source = { x: headX, top: centerY - half, bottom: centerY + half,
               y: Math.max(centerY - half + 2, Math.min(centerY + half - 2, centerY - centsToUnit(current.cents) * half)) };
  }
  drawMagnifier(ctx, source, zoomX, width, scheme, layout.text === "inside");
  // воронка снова от текущей ноты на головке нотоносца

  controls.style.left = zoomX + "px";
  controls.style.width = scaleWidth + "px";
  controls.style.top = (bottomY + 14) + "px";
  // кнопки под шкалой
}

function testMelody() {
  const pitches = [];
  for (let k = 0; k < 60; k++) {
    pitches.push(60 - 0.20 * Math.exp(-k / 2) - 0.05 + 0.17 * k / 60 + 0.03 * Math.sin(k * 0.8));
  }
  for (let k = 0; k < 8; k++) pitches.push(null);
  for (let k = 0; k < 30; k++) pitches.push(64 + (k >= 10 && k < 20 ? 0.30 : 0.02));
  for (let k = 0; k < 6; k++) pitches.push(null);
  for (let k = 0; k < 10; k++) pitches.push(67 + 0.04);
  for (let k = 0; k < 16; k++) pitches.push(67 + 2 * (k + 1) / 16);
  for (let k = 0; k < 12; k++) pitches.push(69 - 0.06);
  for (let k = 0; k < 6; k++) pitches.push(null);
  for (let k = 0; k < 18; k++) pitches.push(68 - 0.25 + 0.04 * Math.sin(k));
  for (let k = 0; k < 4; k++) pitches.push(null);
  for (let k = 0; k < 22; k++) pitches.push(54 + 0.14 - 0.3 * Math.exp(-k / 2));
  for (let k = 0; k < 40; k++) pitches.push(null);
  // часть 1: длинная нота с заездом и дрейфом; ступенька; глиссандо Соль -> Ля; Ля-бемоль ниже на 25; Фа-диез на добавочных

  const drifts = [[0, 0], [-18, -12], [15, 20], [-40, -30], [30, 45], [-30, 30], [25, -25], [5, -5], [-8, 8], [12, -14]];
  function floatingNote(midi, n) {
    const [from, to] = drifts[n % drifts.length];
    for (let k = 0; k < 10; k++) {
      pitches.push(midi + (from + (to - from) * k / 9) / 100 + 0.02 * Math.sin(k * 1.3 + n));
    }
    pitches.push(null, null);
  }
  const chromaticUp = [60, 61, 62, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72];
  const leaps = [60, 67, 61, 68, 63, 70, 66, 73, 56, 65, 58, 71];
  const chromaticDown = [72, 71, 70, 69, 68, 67, 66, 65, 64, 63, 62, 61, 60];
  const zigzag = [60, 62, 61, 63, 62, 64, 63, 65, 64, 66, 65, 67];
  [chromaticUp, leaps, chromaticDown, zigzag].forEach((part) => {
    part.forEach((midi, n) => floatingNote(midi, n));
    for (let k = 0; k < 40; k++) pitches.push(null);
  });
  // часть 2: хроматическая гамма вверх, скачки, гамма вниз, «туда-обратно» (шаг вверх, полшага вниз);
  // нота 0.5 с и 0.1 с тишины; внутри каждой ноты тон плывёт по одному из 10 шаблонов: в допуске,
  // во втором окне, за третьей границей, переход через ноль снизу вверх и сверху вниз

  const furElise = [
    [64, 1, 2], [63, 1, 18], [64, 1, -3], [63, 1, 6], [64, 1, 0], [59, 1, -14], [62, 1, 4], [60, 1, -30], [57, 3, -4], [null, 1, 0],
    [48, 1, 3], [52, 1, -12], [57, 1, 2], [59, 3, 8], [null, 1, 0],
    [52, 1, 0], [56, 1, 32], [59, 1, -6], [60, 3, -18], [null, 1, 0],
    [52, 1, 4], [64, 1, 0], [63, 1, -22], [64, 1, 2], [63, 1, 12], [64, 1, -2], [59, 1, 5], [62, 1, 40], [60, 1, -8], [57, 4, 0]
  ];
  furElise.forEach(([midi, eighths, cents], n) => {
    const total = 12 * eighths;
    if (midi === null) {
      for (let k = 0; k < total; k++) pitches.push(null);
      return;
    }
    for (let k = 0; k < total - 2; k++) {
      pitches.push(midi + cents / 100 - 0.10 * Math.exp(-k / 1.5) + 0.02 * Math.sin(k * 0.9 + n));
    }
    pitches.push(null, null);
  });
  for (let k = 0; k < 40; k++) pitches.push(null);
  // часть 3: начало «К Элизе» на октаву ниже, восьмая = 0.6 с, между нотами 0.1 с тишины; у каждой ноты своё отклонение,
  // чтобы были все зоны: в допуске, 10–25 и дальше 25; Ре-диез и Соль-диез у нас пишутся как Ми-бемоль и Ля-бемоль

  const odeToJoy = [
    [64, 1], [64, 1], [65, 1], [67, 1], [67, 1], [65, 1], [64, 1], [62, 1], [60, 1], [60, 1], [62, 1], [64, 1], [64, 1.5], [62, 0.5], [62, 2],
    [64, 1], [64, 1], [65, 1], [67, 1], [67, 1], [65, 1], [64, 1], [62, 1], [60, 1], [60, 1], [62, 1], [64, 1], [62, 1.5], [60, 0.5], [60, 2],
    [62, 1], [62, 1], [64, 1], [60, 1], [62, 1], [64, 0.5], [65, 0.5], [64, 1], [60, 1], [62, 1], [64, 0.5], [65, 0.5], [64, 1], [62, 1], [60, 1], [62, 1], [55, 2],
    [64, 1], [64, 1], [65, 1], [67, 1], [67, 1], [65, 1], [64, 1], [62, 1], [60, 1], [60, 1], [62, 1], [64, 1], [62, 1.5], [60, 0.5], [60, 2]
  ];
  const tendency = { 60: 0.02, 62: 0.05, 64: -0.14, 65: 0.08, 67: 0.0, 55: -0.04 };
  odeToJoy.forEach(([midi, beats], n) => {
    const total = Math.round(12 * beats);
    const rest = beats < 1 ? 1 : 3;
    for (let k = 0; k < total - rest; k++) {
      pitches.push(midi + tendency[midi] - 0.15 * Math.exp(-k / 1.5) + 0.03 * Math.sin(k * 0.7 + n));
    }
    for (let k = 0; k < rest; k++) pitches.push(null);
  });
  // часть 4: «Ода к радости» в до мажоре (написанные ноты), четверть = 0.6 с;
  // каждая нота заходит снизу; Ми ниже на 14 центов, как 5-й обертон натуральной валторны; короткие паузы на атаку языком
  return pitches;
}

}
// один анализатор на всё: в него идёт либо микрофон, либо тестовая мелодия

function resetTracks() {
  tracks.B = createTrack(detectFrequencyYin);
}

async function startMicrophone() {
  if (micSource) return;
  try {
    setupAudio();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micSource = audioContext.createMediaStreamSource(stream);
    if (!testPlaying) micSource.connect(analyser);
    resetTracks();
    drawAll();
    setStatus("Microphone is on.");
  } catch (error) {
    setStatus("Error: " + error.name);
  }
}

function playTestMelody() {
  if (testPlaying) return;
  setupAudio();
  audioContext.resume();
  testPlaying = true;
  if (micSource) micSource.disconnect();
  resetTracks();
  drawAll();

  const pitches = testMelody();
  const step = 0.05;
  const start = audioContext.currentTime + 0.1;
  const real = new Float32Array([0, 0, 0, 0, 0, 0, 0, 0]);
  const imag = new Float32Array([0, 1, 0.7, 0.5, 0.35, 0.2, 0.12, 0.08]);
  const oscillator = audioContext.createOscillator();
  oscillator.setPeriodicWave(audioContext.createPeriodicWave(real, imag));
  const volume = audioContext.createGain();
  volume.gain.value = 0;
  oscillator.connect(volume);
  volume.connect(analyser);
  volume.connect(audioContext.destination);
  // звук с обертонами (сила 1, 0.7, 0.5...), идёт и в колонки, и в анализатор

  let previous = null;
  pitches.forEach((pitch, k) => {
    const time = start + k * step;
    if (pitch === null) {
      volume.gain.setTargetAtTime(0, time, 0.01);
    } else if (previous === null) {
      oscillator.frequency.setValueAtTime(writtenMidiToFrequency(pitch), time);
      volume.gain.setTargetAtTime(0.3, time, 0.015);
    } else {
      oscillator.frequency.linearRampToValueAtTime(writtenMidiToFrequency(pitch), time);
    }
    previous = pitch;
  });
  // расписание: каждые 50 мс новая частота; после тишины нота начинается сразу, внутри фразы плавно переезжает

  oscillator.start(start);
  oscillator.stop(start + pitches.length * step + 0.1);
  setStatus("Test melody is playing.");
  oscillator.onended = () => {
    volume.disconnect();
    testPlaying = false;
    if (micSource) micSource.connect(analyser);
    setStatus(micSource ? "Microphone is on." : "Test melody finished.");
  };
  // в конце возвращаем микрофон, если он был включён
}

let frameCount = 0;

function processTrack(name, loudness) {
  track = tracks[name];
  let frequency = null;
  track.clarity = null;
  if (loudness > minLoudness) {
    const result = track.detect(samples, audioContext.sampleRate);
    track.clarity = result.clarity;
    if (track.clarity >= minClarity) frequency = result.frequency;
  }
  // громко и чисто — частота; иначе — тишина

  track.frames.push(frequency);
  if (track.frames.length > smoothingFrames) track.frames.shift();
  const sounding = track.frames.filter((value) => value !== null);
  track.smoothed = sounding.length > smoothingFrames / 2 ? median(sounding) : null;
  if (track.history.length > 4000) track.history.shift();
  const lengthBefore = track.history.length;
  addFrame(track.smoothed === null ? null : frequencyToWrittenMidi(track.smoothed));
  // скользящая медиана последних 7 кадров -> трекер нот

  if (track.history.length > lengthBefore) {
    track.raw.push(frequency === null ? null : frequencyToWrittenMidi(frequency));
    if (track.raw.length > 4000) track.raw.shift();
  }
  // сырая высота кадра — для графика частоты; пишем, только если лента нотоносца в этот кадр сдвинулась:
  // так оба графика едут вместе, с одинаковым зазором, и вместе останавливаются в тишине

  if (track.current === null) {
    track.shownCents = null;
    track.shownHertz = null;
  } else if (frameCount % centsEveryFrames === 0 || track.shownCents === null || track.shownNote !== track.current) {
    track.shownCents = track.lastCents;
    track.shownHertz = track.smoothed;
    track.shownNote = track.current;
  }
  if (frameCount % centsEveryFrames === 0) {
    const text = "level " + loudness.toFixed(3) + " (min " + minLoudness + ") · clarity " + (track.clarity === null ? "—" : track.clarity.toFixed(2)) + " (min " + minClarity + ")";
    document.querySelector("#controls" + name + " .debug").textContent = text;
  }
  // число центов и герцы — раз в 8 кадров и сразу при смене ноты; временная строка: громкость, чистота и пороги
}

function update() {
  analyser.getFloatTimeDomainData(samples);
  let sum = 0;
  for (let i = 0; i < samples.length; i++) {
    sum += samples[i] * samples[i];
  }
  const loudness = Math.sqrt(sum / samples.length);
  document.querySelectorAll(".fill").forEach((fill) => { fill.style.width = Math.min(100, loudness * 500) + "%"; });
  frameCount++;
  processTrack("B", loudness);
  drawAll();
  // каждый кадр: YIN -> трекер нот -> рисуем ленту, график частоты и лупу

  requestAnimationFrame(update);
}

document.getElementById("controlsB").innerHTML =
  '<div class="meter"><div class="fill"></div></div>' +
  '<div class="row">' +
  '<div class="seg" id="instrument"><button data-value="0">C</button><button data-value="2">B♭</button><button data-value="7">F</button></div>' +
  '<div class="seg" id="pitch"><button data-value="440">440</button><button data-value="442">442</button></div>' +
  '</div>' +
  '<div class="row"><button class="start">Microphone</button><button class="test">Test</button></div>' +
  '<button id="hold">Stop in silence</button>' +
  '<p class="status">Microphone is off.</p>' +
  '<p class="status debug"></p>';
document.querySelector(".start").addEventListener("click", startMicrophone);
document.querySelector(".test").addEventListener("click", playTestMelody);
// под шкалой: громкость, строй инструмента и строй ля, кнопки, строки состояния

function markSwitches() {
  document.querySelectorAll("#instrument button").forEach((b) => b.classList.toggle("on", Number(b.dataset.value) === transposition));
  document.querySelectorAll("#pitch button").forEach((b) => b.classList.toggle("on", Number(b.dataset.value) === referenceA));
  document.getElementById("hold").classList.toggle("on", stopOnSilence);
}
document.querySelectorAll("#instrument button").forEach((b) => b.addEventListener("click", () => {
  transposition = Number(b.dataset.value);
  try { localStorage.setItem("transposition", transposition); } catch (error) {}
  resetTracks(); markSwitches(); drawAll();
}));
document.querySelectorAll("#pitch button").forEach((b) => b.addEventListener("click", () => {
  referenceA = Number(b.dataset.value);
  try { localStorage.setItem("referenceA", referenceA); } catch (error) {}
  resetTracks(); markSwitches(); drawAll();
}));
document.getElementById("hold").addEventListener("click", () => {
  stopOnSilence = !stopOnSilence;
  try { localStorage.setItem("stopOnSilence", stopOnSilence ? "on" : "off"); } catch (error) {}
  markSwitches();
});
markSwitches();
// тумблер «Stop in silence»: белый — ленты стоят в тишине, чёрный — едут всегда
// переключатели: выбранный белый; при смене строя лента начинается заново, иначе старые ноты стояли бы не там

const strip = document.getElementById("layoutB");
let dragging = false;
strip.addEventListener("pointerdown", (event) => {
  const x = event.clientX - strip.getBoundingClientRect().left;
  if (Math.abs(x - dividerX) < 14) {
    dragging = true;
    strip.setPointerCapture(event.pointerId);
    event.preventDefault();
  }
});
strip.addEventListener("pointermove", (event) => {
  const x = event.clientX - strip.getBoundingClientRect().left;
  strip.style.cursor = dragging || Math.abs(x - dividerX) < 14 ? "ew-resize" : "default";
  if (!dragging) return;
  const width = strip.clientWidth;
  const headX = Math.round(width - Math.max(200, Math.min(260, width * 0.22)) - Math.max(40, width * 0.06));
  graphShare = Math.max(80, Math.min(headX - 150, x)) / width;
  drawAll();
});
strip.addEventListener("pointerup", () => {
  if (!dragging) return;
  dragging = false;
  try { localStorage.setItem("graphShare", graphShare); } catch (error) {}
});
// правую границу графика можно таскать мышкой или пальцем; ширина запоминается

window.addEventListener("resize", drawAll);
drawAll();
</script>
</body>
